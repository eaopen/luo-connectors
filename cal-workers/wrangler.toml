name = "luo-calendar-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# Routes
routes = [
  { pattern = "https://api-luo.openea.site/*", zone_name = "openea.site" }
]

# Environment variables
[vars]
R2_BUCKET_NAME = "luo-calendar-data"
R2_KV_NAMESPACE = "luo_cache"
API_VERSION = "v1"

# R2 Bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "luo-calendar-data"

# KV Namespace binding (optional, for cache control)
[[kv_namespaces]]
binding = "CACHE"
id = "2ffdbcc3382e4aa9877c8a8e072ba4c8"

# Placement (optional, for regional deployment)
[placement]
mode = "smart"
